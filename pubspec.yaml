name: intl_phone_field2
description: A customised Flutter phone number input with country code picker, built on material_ui and cupertino_ui.
version: 4.0.0
homepage: https://github.com/nirmalyohannan/intl_phone_field2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  assets:
    # Flag images are only shown where emoji flags don't render (see
    # useImageFlags in lib/src/country_flag.dart); other platforms skip the 1 MB.
    - path: assets/flags/
      platforms: [web, windows]
